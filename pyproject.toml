[project]
name = "nbs-fetcher"
version = "0.1.0"
description = "Fetch data from the current National Bureau of Statistics website API."
readme = "README.md"
authors = [
    { name = "RETracker Team" }
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "pandas>=1.4.1",
    "urllib3<2.0.0",
    "tabulate>=0.9.0",
    "wcwidth>=0.6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/RETracker/nbs_fetcher"

[project.scripts]
nbs-fetcher = "nbs_fetcher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["nbs_fetcher"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-recording>=0.13.2",
    "vcrpy>=4.3.0",
]
